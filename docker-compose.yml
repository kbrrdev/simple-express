# Rotates container logs, as they would otherwise grow until the disk is full.
x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '5'

services:
  db:
    logging: *logging
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-blog}
    ports:
      # Only this machine can reach it. Docker can bypass firewall rules on public ports.
      - '127.0.0.1:${POSTGRES_PORT:-5433}:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 10

  # Disposable database for npm test. Data is lost when the container stops.
  db-test:
    image: postgres:17-alpine
    profiles: [test]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: blog_test
    ports:
      - '127.0.0.1:5434:5432'
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d blog_test']
      interval: 2s
      timeout: 3s
      retries: 15

  api:
    build: .
    logging: *logging
    environment:
      PORT: 3000
      APP_ENV: ${APP_ENV:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:${PORT:-3000}}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      TAX_RATE_PERCENT: ${TAX_RATE_PERCENT:-12}
      PRICES_INCLUDE_TAX: ${PRICES_INCLUDE_TAX:-true}
      SHIPPING_FEE_CENTS: ${SHIPPING_FEE_CENTS:-10000}
      MAX_OPEN_UNPAID_ORDERS: ${MAX_OPEN_UNPAID_ORDERS:-5}
      PAYMENT_WINDOW_HOURS: ${PAYMENT_WINDOW_HOURS:-24}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_PUBLIC_URL: ${S3_PUBLIC_URL:-}
      # The API runs as a limited role. The owner is only used for migrations.
      DATABASE_URL: postgres://${APP_DB_USER:-app}:${APP_DB_PASSWORD:?Set APP_DB_PASSWORD in .env}@db:5432/${POSTGRES_DB:-blog}
      MIGRATION_DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-blog}
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-0}
    ports:
      # Caddy is the way in. Docker can bypass firewall rules on public ports.
      - '127.0.0.1:${PORT:-3000}:3000'
    volumes:
      - uploads-data:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    # Apply pending migrations, then hand over to node so it receives SIGTERM directly.
    command: sh -c "node dist/db/migrate.js && unset MIGRATION_DATABASE_URL && exec node dist/index.js"

volumes:
  db-data:
  uploads-data:
