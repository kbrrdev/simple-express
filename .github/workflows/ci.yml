name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # Test-only values. docker-compose.yml needs them even to start the test database.
      JWT_SECRET: ci-only-secret-at-least-32-characters-long
      APP_DB_PASSWORD: ci-only-password
      POSTGRES_PASSWORD: ci-only-password
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5434/blog_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm audit --omit=dev --audit-level=high
      - run: npm test
      - run: npm run build
